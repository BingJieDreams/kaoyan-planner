<!doctype html><meta charset="utf-8"><title>extract</title><body style="font:14px/1.6 system-ui;padding:16px"><h3>PDF 提取器</h3><input type="file" id="f" accept="application/pdf"><pre id="log"></pre><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";window.__pages=[];window.__raw="";document.getElementById("f").onchange=async function(e){var file=e.target.files[0];if(!file)return;var log=document.getElementById("log");log.textContent="reading...";var buf=await file.arrayBuffer();var pdf=await pdfjsLib.getDocument({data:buf}).promise;window.__n=pdf.numPages;var all=[];for(var i=1;i<=pdf.numPages;i++){var page=await pdf.getPage(i);var tc=await page.getTextContent();all.push(tc.items.map(function(it){return it.str;}).join(" "));log.textContent="page "+i+"/"+pdf.numPages;}window.__pages=all;window.__raw=all.join("\n");log.textContent="done "+pdf.numPages+" pages chars="+window.__raw.length;};</script></body>
